[tool.poetry]
name = "finance-now-backend"
version = "1.0.0"
description = "Crypto Asset Evaluation Platform — backend API"
authors = ["Finance Now Engineering <engineering@financenow.example>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.2.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
apscheduler = "^3.10.4"
numpy = "^1.26.0"
scipy = "^1.12.0"
pandas = "^2.2.0"
pyotp = "^2.9.0"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
faker = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
types-passlib = "^1.7.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N805"]

[tool.ruff.per-file-ignores]
# Package __init__ modules re-export their submodules' public names; those
# imports are intentional, not unused. Without this, `ruff --fix` silently
# strips the re-exports and breaks `from app.<pkg> import <name>`.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "app/db/migrations/*"]
