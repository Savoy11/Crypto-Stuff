name: CD — Deploy to Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'         # Semantic version tags: v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'  # Release candidates: v1.2.3-rc.1

  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to deploy (must exist in ECR, e.g. v1.2.3)'
        required: true
      confirm_production:
        description: 'Type CONFIRM to acknowledge production deploy'
        required: true
      rollback_version:
        description: 'Previous version to rollback to if deploy fails (leave empty to disable auto-rollback)'
        required: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write
  packages: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO_BACKEND: fn-production/backend
  ECR_REPO_FRONTEND: fn-production/frontend
  # Terraform names this role "${project_name}-${environment}-cicd-deploy-role", so
  # staging and production can coexist in one account. It is NOT "fn-cicd-deploy-role".
  CICD_ROLE_NAME: fn-production-cicd-deploy-role
  EKS_CLUSTER: fn-production-eks
  KUBERNETES_NAMESPACE: fn

###############################################################################
# Jobs
###############################################################################

jobs:

  # ─── Pre-flight Validation ────────────────────────────────────────────────
  preflight:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      # An unset AWS_ACCOUNT_ID renders the role ARN as arn:aws:iam:::role/... and the
      # OIDC action retries for over two minutes before failing with "Request ARN is
      # invalid", which reads like an AWS outage rather than a missing secret. Fail
      # here instead, naming the secret. See docs/deployment/aws-provisioning.md.
      - name: Preflight — required secrets
        run: |
          missing=()
          [ -n "${{ secrets.AWS_ACCOUNT_ID }}" ] || missing+=("AWS_ACCOUNT_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Deploy secrets not configured::Missing repository secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "See docs/deployment/aws-provisioning.md for the full provisioning runbook."
            exit 1
          fi
          echo "Required deploy secrets are present."

      - name: Validate manual trigger confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "CONFIRM" ]; then
            echo "ERROR: You must type CONFIRM to deploy to production."
            exit 1
          fi

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${TAG}"

      - name: Validate semantic version format
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "ERROR: Tag '$TAG' is not a valid semantic version (e.g., v1.2.3)"
            exit 1
          fi
          echo "Version tag is valid: $TAG"

  # ─── Promote Staging Images to Production ────────────────────────────────
  promote-images:
    name: Promote Images from Staging to Production ECR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight

    outputs:
      backend_image: ${{ steps.promote.outputs.backend_image }}
      frontend_image: ${{ steps.promote.outputs.frontend_image }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.CICD_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fn-cd-production-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote images
        id: promote
        run: |
          VERSION="${{ needs.preflight.outputs.version_tag }}"

          BACKEND_SRC="${{ env.ECR_REGISTRY }}/fn-staging/backend:${VERSION}"
          BACKEND_DST="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${VERSION}"
          FRONTEND_SRC="${{ env.ECR_REGISTRY }}/fn-staging/frontend:${VERSION}"
          FRONTEND_DST="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${VERSION}"

          # Pull from staging, re-tag for production ECR.
          #
          # No :latest tag — the production ECR repositories are
          # image_tag_mutability = IMMUTABLE, so re-pushing :latest fails with
          # ImageTagAlreadyExistsException on the second release. Deploys reference
          # the version tag, and the rollback path below does too, so nothing reads it.
          docker pull "$BACKEND_SRC"
          docker tag "$BACKEND_SRC" "$BACKEND_DST"
          docker push "$BACKEND_DST"

          docker pull "$FRONTEND_SRC"
          docker tag "$FRONTEND_SRC" "$FRONTEND_DST"
          docker push "$FRONTEND_DST"

          echo "backend_image=${BACKEND_DST}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_DST}" >> $GITHUB_OUTPUT
          echo "Images promoted to production ECR."

      - name: Final image vulnerability scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.3

          echo "Scanning backend image..."
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            ${{ steps.promote.outputs.backend_image }}

          echo "Scanning frontend image..."
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            ${{ steps.promote.outputs.frontend_image }}

  # ─── Create GitHub Deployment ────────────────────────────────────────────
  create-deployment:
    name: Create GitHub Deployment Record
    runs-on: ubuntu-latest
    needs: [preflight, promote-images]

    outputs:
      deployment_id: ${{ steps.create.outputs.deployment_id }}

    steps:
      - name: Create deployment
        id: create
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          ref: ${{ needs.preflight.outputs.version_tag }}
          description: "Deploy ${{ needs.preflight.outputs.version_tag }} to production"

  # ─── Deploy to Production ────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, promote-images, create-deployment]
    environment:
      name: production
      url: https://financenow.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.version_tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.CICD_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Set up kubectl and Helm
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.29.0'

      - name: Record current image versions (for rollback)
        id: current_versions
        run: |
          CURRENT_BACKEND=$(kubectl get deployment fn-backend \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")
          CURRENT_FRONTEND=$(kubectl get deployment fn-frontend \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")

          echo "current_backend=${CURRENT_BACKEND}" >> $GITHUB_OUTPUT
          echo "current_frontend=${CURRENT_FRONTEND}" >> $GITHUB_OUTPUT
          echo "Previous backend: ${CURRENT_BACKEND}"
          echo "Previous frontend: ${CURRENT_FRONTEND}"

      - name: Apply Kubernetes manifests
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.version_tag }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/configmap.yaml \
            -n ${{ env.KUBERNETES_NAMESPACE }}

          # Backend
          envsubst '${ECR_REGISTRY} ${ECR_REPO_BACKEND} ${ECR_REPO_FRONTEND} ${IMAGE_TAG}' \
            < infrastructure/kubernetes/backend/deployment.yaml \
            | kubectl apply -f - -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl apply -f infrastructure/kubernetes/backend/service.yaml \
            -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl apply -f infrastructure/kubernetes/backend/hpa.yaml \
            -n ${{ env.KUBERNETES_NAMESPACE }}

          # Frontend
          envsubst '${ECR_REGISTRY} ${ECR_REPO_BACKEND} ${ECR_REPO_FRONTEND} ${IMAGE_TAG}' \
            < infrastructure/kubernetes/frontend/deployment.yaml \
            | kubectl apply -f - -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl apply -f infrastructure/kubernetes/frontend/service.yaml \
            -n ${{ env.KUBERNETES_NAMESPACE }}

          # Ingress
          kubectl apply -f infrastructure/kubernetes/ingress.yaml \
            -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/fn-backend \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=600s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/fn-frontend \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=300s

      - name: Production health checks
        id: health_check
        run: |
          BASE_URL="https://financenow.example.com"

          echo "Waiting 30 seconds for pods to be fully ready..."
          sleep 30

          # Check health endpoint
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" --max-time 15)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed: HTTP $STATUS"
              break
            fi
            echo "Health check attempt $i failed (HTTP $STATUS), retrying in 10s..."
            sleep 10
            if [ $i -eq 5 ]; then
              echo "ERROR: Health checks failed after 5 attempts"
              exit 1
            fi
          done

          # Check API responds
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/v1/assets?limit=1" --max-time 15)
          echo "Assets API returned: HTTP $STATUS"

      - name: Auto-rollback on failure
        if: failure() && steps.health_check.conclusion == 'failure'
        run: |
          ROLLBACK_VERSION="${{ github.event.inputs.rollback_version }}"
          CURRENT_BACKEND="${{ steps.current_versions.outputs.current_backend }}"

          if [ -n "$ROLLBACK_VERSION" ] || [ "$CURRENT_BACKEND" != "none" ]; then
            echo "DEPLOYING ROLLBACK..."

            if [ -n "$ROLLBACK_VERSION" ]; then
              BACKEND_IMG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${ROLLBACK_VERSION}"
              FRONTEND_IMG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${ROLLBACK_VERSION}"
            else
              BACKEND_IMG="$CURRENT_BACKEND"
              FRONTEND_IMG="${{ steps.current_versions.outputs.current_frontend }}"
            fi

            kubectl set image deployment/fn-backend \
              backend="$BACKEND_IMG" \
              -n ${{ env.KUBERNETES_NAMESPACE }}
            kubectl set image deployment/fn-frontend \
              frontend="$FRONTEND_IMG" \
              -n ${{ env.KUBERNETES_NAMESPACE }}

            kubectl rollout status deployment/fn-backend \
              -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=300s || true

            echo "Rollback applied."
          else
            echo "No rollback version available. Manual intervention required."
          fi

      - name: Update GitHub Deployment status — success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          state: success
          environment-url: https://financenow.example.com

      - name: Update GitHub Deployment status — failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          state: failure

  # ─── Post-deploy Verification ─────────────────────────────────────────────
  post-deploy-tests:
    name: Post-Deploy Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.version_tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run post-deploy tests
        env:
          PROD_URL: https://financenow.example.com
          POST_DEPLOY_API_KEY: ${{ secrets.PROD_HEALTH_CHECK_KEY }}
        run: |
          pip install httpx pytest pytest-asyncio
          python -m pytest tests/integration/post_deploy/ \
            --base-url="$PROD_URL" \
            -v --tb=short --timeout=60 \
            -m "post_deploy" || true

  # ─── Create GitHub Release ────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, deploy-production]
    if: success() && !contains(needs.preflight.outputs.version_tag, '-rc.')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.version_tag }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "rc" | sed -n '2p' || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null | head -50)
          else
            CHANGES=$(git log --oneline --no-merges HEAD | head -20)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.preflight.outputs.version_tag }}
          name: "Finance Now ${{ needs.preflight.outputs.version_tag }}"
          body: |
            ## What's Changed in ${{ needs.preflight.outputs.version_tag }}

            ${{ steps.changelog.outputs.changes }}

            ## Docker Images
            - Backend: `${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ needs.preflight.outputs.version_tag }}`
            - Frontend: `${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ needs.preflight.outputs.version_tag }}`

            ## Deployment
            - Deployed to production: https://financenow.example.com
            - Deployed by: @${{ github.actor }}
            - Run ID: ${{ github.run_id }}
          makeLatest: true
          draft: false
          prerelease: false

  # ─── Notify ───────────────────────────────────────────────────────────────
  notify-production:
    name: Notify Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, deploy-production, post-deploy-tests]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=rocket" >> $GITHUB_OUTPUT
            echo "color=#28a745" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "emoji=fire" >> $GITHUB_OUTPUT
            echo "color=#dc3545" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack #fn-releases
        uses: slackapi/slack-github-action@v4.0.0
        with:
          channel-id: ${{ secrets.SLACK_RELEASES_CHANNEL_ID }}
          payload: |
            {
              "text": ":${{ steps.status.outputs.emoji }}: Finance Now Production Deploy — ${{ steps.status.outputs.status }}",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "fields": [
                    { "title": "Version", "value": "${{ needs.preflight.outputs.version_tag }}", "short": true },
                    { "title": "Status", "value": "${{ steps.status.outputs.status }}", "short": true },
                    { "title": "Deployed by", "value": "${{ github.actor }}", "short": true },
                    { "title": "Production URL", "value": "<https://financenow.example.com|financenow.example.com>", "short": true }
                  ],
                  "footer": "Finance Now Production | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
