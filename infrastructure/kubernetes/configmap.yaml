apiVersion: v1
kind: ConfigMap
metadata:
  name: caep-backend-config
  namespace: caep
  labels:
    app: caep-backend
    component: config
    app.kubernetes.io/name: caep
    app.kubernetes.io/component: backend
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  WORKERS: "4"
  WORKER_CONNECTIONS: "1000"
  MAX_REQUESTS: "10000"
  MAX_REQUESTS_JITTER: "1000"
  KEEPALIVE: "5"
  CORS_ORIGINS: "https://caep.example.com,https://www.caep.example.com"
  ALLOWED_HOSTS: "caep.example.com,www.caep.example.com,caep-backend.caep.svc.cluster.local"
  CACHE_TTL_SECONDS: "300"
  SCORING_CACHE_TTL_SECONDS: "60"
  PRICE_CACHE_TTL_SECONDS: "30"
  WEBSOCKET_PING_INTERVAL: "20"
  WEBSOCKET_PING_TIMEOUT: "10"
  MAX_WEBSOCKET_CONNECTIONS: "10000"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  DB_POOL_PRE_PING: "true"
  DB_POOL_RECYCLE: "3600"
  REDIS_MAX_CONNECTIONS: "100"
  REDIS_DECODE_RESPONSES: "true"
  COINGECKO_BASE_URL: "https://api.coingecko.com/api/v3"
  DEFILLAMA_BASE_URL: "https://api.llama.fi"
  CHAINLINK_FEED_REGISTRY: "0x47Fb2585D2C56Fe188D0E6ec628a38b74fCeeeDf"
  ALERT_EVALUATION_INTERVAL_SECONDS: "30"
  SCORING_UPDATE_INTERVAL_SECONDS: "300"
  PRICE_FETCH_INTERVAL_SECONDS: "60"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caep-frontend-config
  namespace: caep
  labels:
    app: caep-frontend
    component: config
data:
  NEXT_PUBLIC_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://caep.example.com/api"
  NEXT_PUBLIC_WS_URL: "wss://caep.example.com/ws"
  NEXT_TELEMETRY_DISABLED: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caep-nginx-config
  namespace: caep
  labels:
    app: caep-nginx
    component: config
data:
  NGINX_WORKER_PROCESSES: "auto"
  NGINX_WORKER_CONNECTIONS: "4096"
  NGINX_KEEPALIVE_TIMEOUT: "75"
  NGINX_CLIENT_MAX_BODY_SIZE: "20m"
