# IMPORTANT: This file is a TEMPLATE only.
# Real secrets must NEVER be committed to source control.
#
# In production, use one of the following approaches:
#   1. AWS Secrets Manager + External Secrets Operator (recommended)
#   2. HashiCorp Vault + Vault Agent Injector
#   3. Kubernetes sealed-secrets (Bitnami)
#   4. SOPS (Mozilla) for encrypted secrets in git
#
# To apply this template, replace all <PLACEHOLDER> values before applying:
#   kubectl create secret generic fn-backend-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://user:pass@host/db" \
#     ... etc \
#     --namespace=fn --dry-run=client -o yaml | kubectl apply -f -
#
# For ExternalSecrets (recommended production approach), see:
# https://external-secrets.io/latest/provider/aws-secrets-manager/

---
# Example ExternalSecret (requires External Secrets Operator installed)
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: fn-backend-secrets
#   namespace: fn
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     kind: ClusterSecretStore
#     name: aws-secretsmanager
#   target:
#     name: fn-backend-secrets
#     creationPolicy: Owner
#   data:
#     - secretKey: SECRET_KEY
#       remoteRef:
#         key: fn/production/backend
#         property: secret_key
#     - secretKey: DATABASE_URL
#       remoteRef:
#         key: fn/production/backend
#         property: database_url
#     - secretKey: REDIS_URL
#       remoteRef:
#         key: fn/production/backend
#         property: redis_url
#     - secretKey: COINGECKO_API_KEY
#       remoteRef:
#         key: fn/production/api-keys
#         property: coingecko
#     - secretKey: DEFILLAMA_API_KEY
#       remoteRef:
#         key: fn/production/api-keys
#         property: defillama

---
# Placeholder secret — DO NOT use in production without replacing values
# Values here are base64-encoded placeholders only
apiVersion: v1
kind: Secret
metadata:
  name: fn-backend-secrets
  namespace: fn
  labels:
    app: fn-backend
    component: secrets
  annotations:
    # Warn operators that this is a template
    financenow.example/secret-type: "template"
    financenow.example/rotate-after: "90d"
type: Opaque
stringData:
  # REPLACE THESE WITH REAL VALUES — do not commit real values
  SECRET_KEY: "<REPLACE_WITH_64_CHAR_RANDOM_HEX>"
  DATABASE_URL: "<REPLACE_WITH_REAL_DB_URL>"
  REDIS_URL: "<REPLACE_WITH_REAL_REDIS_URL>"
  REDIS_PASSWORD: "<REPLACE_WITH_REAL_REDIS_PASSWORD>"
  COINGECKO_API_KEY: "<REPLACE_WITH_REAL_API_KEY>"
  DEFILLAMA_API_KEY: "<REPLACE_WITH_REAL_API_KEY>"
  CHAINLINK_RPC_URL: "<REPLACE_WITH_REAL_RPC_URL>"
  SENTRY_DSN: "<REPLACE_WITH_REAL_SENTRY_DSN>"
  SMTP_PASSWORD: "<REPLACE_WITH_REAL_SMTP_PASSWORD>"
  JWT_PRIVATE_KEY: "<REPLACE_WITH_RSA_PRIVATE_KEY>"
  JWT_PUBLIC_KEY: "<REPLACE_WITH_RSA_PUBLIC_KEY>"
---
apiVersion: v1
kind: Secret
metadata:
  name: fn-postgres-secrets
  namespace: fn
  labels:
    app: fn-postgres
    component: secrets
type: Opaque
stringData:
  POSTGRES_USER: "<REPLACE>"
  POSTGRES_PASSWORD: "<REPLACE>"
  POSTGRES_DB: "caep"
  POSTGRES_REPLICATION_USER: "<REPLACE>"
  POSTGRES_REPLICATION_PASSWORD: "<REPLACE>"
---
apiVersion: v1
kind: Secret
metadata:
  name: fn-ecr-credentials
  namespace: fn
  labels:
    component: registry-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "<AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com": {
          "auth": "<REPLACE_WITH_BASE64_ENCODED_TOKEN>"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: fn-tls-secret
  namespace: fn
  labels:
    component: tls
  annotations:
    # cert-manager will manage this in production
    cert-manager.io/issuer: "letsencrypt-prod"
type: kubernetes.io/tls
stringData:
  tls.crt: "<REPLACE_WITH_PEM_CERT>"
  tls.key: "<REPLACE_WITH_PEM_KEY>"
