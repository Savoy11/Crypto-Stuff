apiVersion: v1
kind: Service
metadata:
  name: fn-frontend
  namespace: fn
  labels:
    app: fn-frontend
    component: frontend
    app.kubernetes.io/name: fn-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: fn
spec:
  type: ClusterIP
  selector:
    app: fn-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fn-frontend-hpa
  namespace: fn
  labels:
    app: fn-frontend
    component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fn-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
