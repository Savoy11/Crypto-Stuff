apiVersion: v1
kind: Service
metadata:
  name: fn-postgres
  namespace: fn
  labels:
    app: fn-postgres
    component: database
    app.kubernetes.io/name: fn-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fn
spec:
  type: ClusterIP
  selector:
    app: fn-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  sessionAffinity: None
---
# Headless service for StatefulSet DNS-based discovery
apiVersion: v1
kind: Service
metadata:
  name: fn-postgres-headless
  namespace: fn
  labels:
    app: fn-postgres
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: fn-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  publishNotReadyAddresses: false
