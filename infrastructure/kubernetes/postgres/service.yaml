apiVersion: v1
kind: Service
metadata:
  name: caep-postgres
  namespace: caep
  labels:
    app: caep-postgres
    component: database
    app.kubernetes.io/name: caep-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: caep
spec:
  type: ClusterIP
  selector:
    app: caep-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  sessionAffinity: None
---
# Headless service for StatefulSet DNS-based discovery
apiVersion: v1
kind: Service
metadata:
  name: caep-postgres-headless
  namespace: caep
  labels:
    app: caep-postgres
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: caep-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  publishNotReadyAddresses: false
