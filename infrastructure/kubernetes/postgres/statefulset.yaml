apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: caep-postgres
  namespace: caep
  labels:
    app: caep-postgres
    component: database
    app.kubernetes.io/name: caep-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: caep
  annotations:
    caep.io/description: "TimescaleDB/PostgreSQL 15 StatefulSet — time-series crypto data storage"
spec:
  serviceName: caep-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: caep-postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: caep-postgres
        component: database
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chmod 700 /var/lib/postgresql/data
              chown -R 999:999 /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false

      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          envFrom:
            - secretRef:
                name: caep-postgres-secrets

          env:
            - name: POSTGRES_DB
              value: "caep"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF-8"

          args:
            - postgres
            - -c
            - shared_preload_libraries=timescaledb
            - -c
            - max_connections=300
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=2GB
            - -c
            - maintenance_work_mem=128MB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=32MB
            - -c
            - default_statistics_target=200
            - -c
            - random_page_cost=1.1
            - -c
            - work_mem=8MB
            - -c
            - log_min_duration_statement=500
            - -c
            - log_checkpoints=on
            - -c
            - log_connections=off
            - -c
            - log_disconnections=off
            - -c
            - log_lock_waits=on
            - -c
            - log_temp_files=0
            - -c
            - log_autovacuum_min_duration=0
            - -c
            - autovacuum_max_workers=4
            - -c
            - autovacuum_naptime=10s
            - -c
            - track_activities=on
            - -c
            - track_counts=on
            - -c
            - track_io_timing=on

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - caep
                - -d
                - caep
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - caep
                - -d
                - caep
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      volumes:
        - name: postgres-config
          configMap:
            name: caep-postgres-init
            optional: true

      nodeSelector:
        kubernetes.io/os: linux

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: caep-postgres
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 100Gi
