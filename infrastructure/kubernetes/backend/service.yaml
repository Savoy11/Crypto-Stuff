apiVersion: v1
kind: Service
metadata:
  name: caep-backend
  namespace: caep
  labels:
    app: caep-backend
    component: backend
    app.kubernetes.io/name: caep-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: caep
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: caep-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caep-backend-sa
  namespace: caep
  labels:
    app: caep-backend
    app.kubernetes.io/name: caep-backend
  annotations:
    # IRSA: bind to IAM role for AWS service access (S3, Secrets Manager, etc.)
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/caep-backend-role"
automountServiceAccountToken: false
