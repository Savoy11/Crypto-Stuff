###############################################################################
# Finance Now Free — Prometheus Scrape Configuration + Alert Rules
###############################################################################

global:
  scrape_interval:     15s     # Default scrape frequency
  evaluation_interval: 15s     # Rule evaluation frequency
  scrape_timeout:      10s

  # Attach these labels to every time series scraped by this instance
  external_labels:
    cluster: 'fn-production'
    environment: 'production'
    region: 'us-east-1'

# AlertManager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

# Alert rule files
rule_files:
  - /etc/prometheus/rules/*.yml

###############################################################################
# Scrape Configurations
###############################################################################

scrape_configs:

  # ─── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ─── Finance Now Free FastAPI Backend ──────────────────────────────────────────────────
  - job_name: 'fn-backend'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: job
        replacement: fn-backend

  # ─── Kubernetes pod discovery (production EKS) ────────────────────────────
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['fn']
    relabel_configs:
      # Only scrape pods annotated with prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # ─── PostgreSQL / TimescaleDB ──────────────────────────────────────────────
  - job_name: 'postgres-exporter'
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'
    metric_relabel_configs:
      # Drop high-cardinality per-query metrics in dev; enable in prod for query analysis
      - source_labels: [__name__]
        regex: 'pg_stat_statements_.*'
        action: drop

  # ─── Redis ────────────────────────────────────────────────────────────────
  - job_name: 'redis-exporter'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # ─── Node Exporter (host metrics) ─────────────────────────────────────────
  - job_name: 'node-exporter'
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          component: 'infrastructure'
    metric_relabel_configs:
      # Drop filesystem metrics for virtual filesystems
      - source_labels: [fstype]
        regex: 'tmpfs|devtmpfs|devfs|iso9660|overlay|aufs|squashfs'
        action: drop

  # ─── Alertmanager ─────────────────────────────────────────────────────────
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          component: 'monitoring'

  # ─── Grafana ──────────────────────────────────────────────────────────────
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'monitoring'

  # ─── Celery Workers (via Flower) ──────────────────────────────────────────
  - job_name: 'celery-flower'
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['celery-flower:5555']
        labels:
          service: 'celery'
          component: 'worker'
