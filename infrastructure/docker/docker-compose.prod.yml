version: '3.9'

# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      target: production
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - DEFILLAMA_API_KEY=${DEFILLAMA_API_KEY}
      - CHAINLINK_RPC_URL=${CHAINLINK_RPC_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes: []
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      target: production
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:${IMAGE_TAG:-latest}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_ENV=production
    volumes: []
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  nginx:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_NGINX}:${IMAGE_TAG:-latest}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: 2

  postgres:
    # In production, use AWS RDS Aurora — this is only for standalone deployments
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=1GB
        -c max_connections=500
        -c effective_cache_size=4GB
        -c maintenance_work_mem=256MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=64MB
        -c default_statistics_target=200
        -c log_min_duration_statement=500
        -c ssl=on
        -c ssl_cert_file='/etc/ssl/certs/ssl-cert-snakeoil.pem'
        -c ssl_key_file='/etc/ssl/private/ssl-cert-snakeoil.key'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    ports: []
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 2gb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD}
        --loglevel warning
        --save 900 1
        --save 300 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM}

  # Disable dev-only services in production
  postgres-exporter:
    deploy:
      replicas: 1

  redis-exporter:
    deploy:
      replicas: 1
